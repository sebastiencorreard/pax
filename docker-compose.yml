services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pax"]
      interval: 5s
      timeout: 5s
      retries: 10

  # In-memory store for the render cache and the chrono sessions
  # (per-(user, exercise, seed) start timestamps). Ephemeral state only —
  # data loss on restart is acceptable, hence no volume.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./ressources:/ressources:ro
    environment:
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      RESOURCES_ROOT: /ressources
      REDIS_URL: redis://redis:6379/0
      # Restreint le corpus importé au démarrage (cf. `entrypoint.sh`) : vide
      # par défaut, donc tout. La CI y met un sous-ensemble, l'import complet
      # demandant une vingtaine de minutes sur un runner.
      IMPORT_ARGS: ${IMPORT_ARGS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped

volumes:
  pgdata:
