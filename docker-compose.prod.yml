services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  backend:
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Enables /api/render/{id}/debug (solution + expected answers → the
      # "Réponse auto" button). Mirrors the frontend's NUXT_PUBLIC_DEBUG_OEF.
      # Leaks solutions to teachers/admins — keep this off on a real prod host.
      PAX_DEBUG: "1"

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      NUXT_PUBLIC_DEBUG_OEF: "true"
