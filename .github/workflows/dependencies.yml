name: Dépendances

# Dependabot propose les montées ; ce workflow répond à l'autre question — « y
# a-t-il une faille connue, maintenant ? ». Les deux sont nécessaires : un avis
# peut sortir sans qu'aucune montée ne soit disponible (cf. `ecdsa`), et une
# dépendance transitive n'a pas de PR Dependabot dédiée.
on:
  schedule:
    # Lundi 06:00 UTC. Dependabot ouvre ses PR à 06:00 Europe/Brussels, soit
    # 04:00 UTC l'été : ce passage arrive donc après elles, et de toute façon
    # GitHub décale les tâches planifiées de plusieurs heures quand ses files
    # sont chargées. Aucun ordre n'est garanti, et aucun n'est nécessaire — les
    # deux contrôles sont indépendants.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - backend/requirements.txt
      - backend/Dockerfile
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/Dockerfile
      - .github/workflows/dependencies.yml

permissions:
  contents: read

jobs:
  python:
    name: Python — pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Installer pip-audit
        run: pip install --upgrade pip pip-audit

      # `-r` résout le fichier sans installer : plus rapide, et ça audite ce
      # qui est *déclaré* plutôt qu'un environnement qui aurait dérivé.
      #
      # PYSEC-2026-1325 (`ecdsa`, Minerva sur P-256) est écarté : l'amont
      # considère les canaux auxiliaires hors périmètre — « there is no planned
      # fix » —, donc l'avis ne se refermera jamais et rendrait ce contrôle
      # rouge en permanence. Non atteignable ici : PAX signe et vérifie en
      # HS256. Justification complète dans `scripts/check-deps.sh`, à garder
      # synchronisé.
      - name: Auditer les dépendances déclarées
        run: |
          pip-audit -r backend/requirements.txt --desc --progress-spinner off \
            --ignore-vuln PYSEC-2026-1325

      - name: Lister les versions en retard
        if: always()
        run: |
          pip install --quiet -r backend/requirements.txt
          echo '### Python — versions en retard' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pip list --outdated >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  npm:
    name: npm — audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # node 24 pour npm 11, comme `frontend/Dockerfile` — à garder
          # synchronisés. npm 10 ajoute les *peer dependencies optionnelles* à
          # son arbre idéal alors que npm 11 les laisse de côté : un lock écrit
          # par npm 11 lui paraît incomplet et `npm ci` s'arrête. C'est ce qui a
          # cassé ce contrôle sur `commander`, peer optionnelle de `@bomb.sh/tab`
          # tirée par `@nuxt/cli`. Régénérer le lock avec npm 10 lui ferait
          # perdre les champs `libc` (glibc/musl) des binaires natifs, qu'il ne
          # connaît pas : c'est le gestionnaire qu'on aligne, pas le lock.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Seul le périmètre de production fait échouer : l'essentiel des avis npm
      # vise la chaîne de développement (vite, ws, playwright), qui n'est pas
      # servie au public. Ils restent rapportés juste en dessous.
      - name: Auditer les dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Rapporter l'audit complet (sans échouer)
        if: always()
        run: |
          echo '### npm — audit complet (dev inclus)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### npm — versions en retard' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm outdated >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Les deux audits ci-dessus ne regardent que des fichiers de dépendances : une
  # montée d'image de base passait donc sans le moindre contrôle. C'est ce job
  # qui répond à « est-ce que ça construit encore, et est-ce que ça démarre ? ».
  images:
    name: Images — construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Construire l'image backend
        run: docker build -t pax-backend-ci backend

      # Construire ne prouve rien côté Python : `pip install` réussit sans que
      # le moindre module applicatif ne soit importé. Le chargement de `main`
      # traverse les cinq routeurs et donc l'essentiel des dépendances — c'est
      # ainsi qu'un `email-validator` manquant s'était trahi. `SECRET_KEY` est
      # le seul réglage sans valeur par défaut, et `config.py` en exige 32
      # caractères : on en tire une au hasard, elle ne sert qu'à cet import.
      - name: Vérifier que l'application se charge
        run: |
          docker run --rm --entrypoint python \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            pax-backend-ci -c "import main"

      # L'étage `prod` va jusqu'à `nuxt build`, seul endroit où le code source
      # passe entre les mains de rolldown — nettement plus strict que le serveur
      # de développement, au point qu'un fichier non-UTF-8 a pu casser la
      # production sans que le mode dev ne montre quoi que ce soit.
      - name: Construire l'image frontend, bundle de production compris
        run: docker build --target prod -t pax-frontend-ci frontend
