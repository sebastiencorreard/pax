<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<title>Vaardigheidstoets Vervoort Boeken</title>
<body>
<div id="coords_display" style="opacity:0.7;filter:alpha(opacity=70);position:absolute;z-index:100;display:block;background-color:lightgreen;top:0px;left:0px;font-size:26pt;color:black;"></div>

<!-- jm.evers 12/2012 : moved from "click" to "mousemove"  -->
<img id="myimage" src="./RH.jpg" alt="RH.jpg"/>

<script type="text/javascript">
    var sizex=720
    var sizey=550;
    var xmin=-5.8,xmax=48.65,ymin=-17.35,ymax=62.8;
    var rounding=10
    var relx=0;
    var rely=0;
    IE = false;
    var image = document.getElementById('myimage');
    if( !image.addEventListener ){
	image.attachEvent("onmousemove", test);
    }
    else
    {
	image.addEventListener("mousemove", test, false);
    }
    document.getElementById("coords_display").style.top = findPosY()+"px";
    document.getElementById("coords_display").style.left = findPosX()+"px";
    
    function test(e){
	if (!document.all){ // mozillla
	    recalculate(e.pageX,e.pageY);
	    e.stopPropagation();
	}
	else
	{
	    IE=true;
	    recalculate(event.x,event.y);
	}
    }
    
    function recalculate(x,y){
	var xi = findPosX();
	var yi = findPosY();
	if(IE){xi=xi-document.body.scrollLeft ;yi=yi-document.body.scrollTop ;}
	if(x > xi && x < xi+sizex && y > yi && y < yi+sizey){
	    xi=x - xi;yi=y - yi;
	    relx=px2x(xi);rely=px2y(yi);
	    relx=(Math.round(rounding*relx))/rounding;
	    rely=(Math.round(rounding*rely))/rounding;
	    document.getElementById('coords_display').innerHTML='('+relx+" : "+rely+')';
	}
    }
    
    function findPosX(){
	obj = document.getElementById('myimage');
	var curleft = 0;
	if(obj.offsetParent){
    	    while(1){
        	curleft += obj.offsetLeft;
        	if(!obj.offsetParent){break;}
		obj = obj.offsetParent;
    	    }
	}
	else
	{
	    if(obj.x){
    		curleft += obj.x;
	    }
	}
	return curleft;
    }

    function findPosY(){
	obj = document.getElementById('myimage');
	var curtop = 0;
	if(obj.offsetParent){
    	    while(1){
        	curtop += obj.offsetTop;
        	if(!obj.offsetParent){break;}
		obj = obj.offsetParent;
    	    }
	}
	else
	{
	    if(obj.y){
    		curleft += obj.y;
	    }
	}
	return curtop;
    }
    function px2x(px){ //pixel to x-coords
        var X = eval(px*(xmax - xmin)/sizex + xmin);
        return X;
    }
    function px2y(py){ // pixel to y-coords
        Y = eval(ymax -  py*(ymax - ymin)/sizey);
        return Y;
    }
</script>
</body>
</html>
