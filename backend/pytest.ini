[pytest]
markers =
    slow: parcourt le corpus d'exercices (4278 fichiers, une dizaine de minutes)

# Les tests marqués `slow` sont écartés par défaut : `test_exercises_check` et
# `test_exercises_render` rendent chacun l'intégralité du corpus, ce qui n'a pas
# sa place dans une suite qu'on lance à chaque modification. Pour les jouer :
#
#     pytest tests/ -m slow                       # tout le corpus
#     PAX_TEST_CORPUS=H4/algebra pytest -m slow   # un sous-arbre
#
# Cette exclusion remplace les `--ignore` que la CI portait le temps que ces
# deux modules soient réparés — ils ne se collectaient plus du tout : appel à
# `psql`, absent de l'image, et identifiants convertis en entier alors qu'ils
# sont des slugs depuis la migration `c1a2b3d4e5f6`.
addopts = -m "not slow"
